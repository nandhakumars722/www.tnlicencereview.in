<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Shield / Circle -->
  <rect width="64" height="64" rx="14" fill="url(#tnBg)" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#goldRing)" stroke-width="2" stroke-dasharray="2 1" opacity="0.6" />

  <!-- Outer Steering Wheel Rim -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffffff" stroke-width="3.5" />
  <circle cx="32" cy="32" r="19" fill="none" stroke="#10b981" stroke-width="1" />

  <!-- Center Hub -->
  <circle cx="32" cy="32" r="7" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Steering Wheel Spokes (3 spokes at 180, 0, and 90 deg down) -->
  <!-- Left Spoke -->
  <line x1="10" y1="32" x2="25" y2="32" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <!-- Right Spoke -->
  <line x1="39" y1="32" x2="54" y2="32" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <!-- Down Spoke -->
  <line x1="32" y1="39" x2="32" y2="54" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Tamil Nadu ID Badge Emblem Symbol in Center -->
  <path d="M30 29.5 L34 29.5 L33.5 34.5 L30.5 34.5 Z" fill="#064e3b" />
  <circle cx="32" cy="28.5" r="1.2" fill="#064e3b" />

  <!-- Top "TN" lettering -->
  <rect x="23" y="6" width="18" height="8" rx="2" fill="#fbbf24" />
  <text x="32" y="12.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="6" font-weight="900" fill="#064e3b" text-anchor="middle" letter-spacing="0.5">TN RTO</text>
</svg>
